name: Refresh repos.json

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repos
        run: |
          curl -sf "https://pinned.berrysauce.dev/get/thirumuruganra" \
            | node -e "
              const d = JSON.parse(require('fs').readFileSync(0));
              if (!Array.isArray(d) || !d.length) process.exit(1);
              const out = d.map(r => ({
                name: r.name,
                description: r.description ?? '',
                language: r.language ?? null,
                link: r.link ?? 'https://github.com/thirumuruganra/' + r.name,
                stars: r.stars ?? 0,
                forks: r.forks ?? 0,
              }));
              require('fs').writeFileSync('public/repos.json', JSON.stringify(out, null, 2) + '\n');
            "

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/repos.json
          git diff --cached --quiet || git commit -m "chore: refresh repos.json"
          git push
