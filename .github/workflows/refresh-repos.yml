name: Refresh repos.json

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='
            { user(login: "thirumuruganra") {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes { ... on Repository {
                    name
                    description
                    primaryLanguage { name }
                    url
                    stargazerCount
                    forkCount
                  } }
                }
            } }' \
            --jq '[.data.user.pinnedItems.nodes[] | {
              name,
              description: (.description // ""),
              language: (.primaryLanguage.name // null),
              link: .url,
              stars: .stargazerCount,
              forks: .forkCount
            }]' > repos.tmp
          node -e "const d=JSON.parse(require('fs').readFileSync('repos.tmp'));if(!Array.isArray(d)||!d.length)process.exit(1)"
          mv repos.tmp public/repos.json

      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/repos.json
          if git diff --cached --quiet; then
            echo "repos.json unchanged"
            exit 0
          fi
          git commit -m "chore: refresh repos.json"
          git push
          gh workflow run deploy.yml --ref main
