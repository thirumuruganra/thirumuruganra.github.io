name: Deploy Site & Refresh Repo Data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — refresh repo stars/forks in public/repos.json
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch repo details
        run: |
          curl -sf "https://pinned.berrysauce.dev/get/thirumuruganra" -o public/repos.json \
            || gh api "users/thirumuruganra/repos?sort=updated&per_page=30" -q \
               '[.[] | select(.fork|not)][:6] | map({name, description, language, link: .html_url, stars: .stargazers_count, forks: .forks_count})' \
               > public/repos.json
          node -e "const d=JSON.parse(require('fs').readFileSync('public/repos.json'));if(!Array.isArray(d)||!d.length)process.exit(1)" \
            || rm -f public/repos.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
